name: groupagent-checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groupagent_ci
          POSTGRES_PASSWORD: synthetic_ci_fixture_only
          POSTGRES_DB: groupagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groupagent_ci -d groupagent_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GROUPAGENT_TEST_DSN: postgresql://groupagent_ci:synthetic_ci_fixture_only@localhost:5432/groupagent_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-13
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6, verified 2026-11-13
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts deploy
      - run: uv run --no-sync ruff format --check src tests scripts deploy
      - run: uv run --no-sync mypy --no-incremental src deploy/pot_capacity.py deploy/pot_docker_proxy.py deploy/prepare_pot_runtime_secrets.py
      - run: uv run --no-sync pytest --strict-markers --strict-config -m "not render and not sandbox and not live" -q
      - run: uv build --no-build-isolation
      - run: uv run --no-sync pip-audit --progress-spinner off
      - name: Scan publication files for credentials
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          uv run --no-sync python scripts/scan_publication.py

  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groupagent_render_ci
          POSTGRES_PASSWORD: synthetic_render_fixture_only
          POSTGRES_DB: groupagent_render_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groupagent_render_ci -d groupagent_render_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GROUPAGENT_TEST_DSN: postgresql://groupagent_render_ci:synthetic_render_fixture_only@localhost:5432/groupagent_render_test
      GROUPAGENT_RENDER_TESTS: "1"
      GROUPAGENT_FONT_DIRS: /usr/share/fonts
      GROUPAGENT_PDF_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      GROUPAGENT_OFFICE_FONT: WenQuanYi Zen Hei
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.18"
          python-version: "3.13"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-impress poppler-utils fonts-dejavu-core fonts-wqy-zenhei
      - run: uv sync --locked
      - name: Verify rendering dependencies and configured font
        run: |
          set -euo pipefail
          command -v soffice
          command -v pdftotext
          command -v pdftoppm
          test -s "$GROUPAGENT_PDF_FONT"
          test "$(fc-match --format '%{file}' "$GROUPAGENT_OFFICE_FONT")" = "$GROUPAGENT_PDF_FONT"
      - name: Render tests including PostgreSQL delivery completion
        # One serial pytest process owns this job's database and migrations.
        run: uv run --no-sync pytest --strict-markers --strict-config -m render -q --junitxml=runtime/ci/render.xml
      - name: Require executed rendering checks without skips
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases = ElementTree.parse(Path("runtime/ci/render.xml")).findall(".//testcase")
          assert cases, "Rendering job executed no tests"
          assert not any(case.find("skipped") is not None for case in cases), "Required rendering checks skipped"
          PY

  isolated-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groupagent_worker_ci
          POSTGRES_PASSWORD: synthetic_worker_fixture_only
          POSTGRES_DB: groupagent_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groupagent_worker_ci -d groupagent_worker_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GROUPAGENT_TEST_DSN: postgresql://groupagent_worker_ci:synthetic_worker_fixture_only@localhost:5432/groupagent_worker_test
      GROUPAGENT_PDF_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      GROUPAGENT_TEST_CJK_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      GROUPAGENT_TEST_CJK_FONT_INDEX: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.18"
          python-version: "3.13"
          enable-cache: true
      - name: Install a CJK font for synthetic host-side OCR fixtures
        # TTC face 2 is Noto Sans CJK SC; keep PDF's WQY font independent.
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk
      - run: uv sync --locked
      - name: Build immutable workers from the reviewed lock and SDK hashes
        run: |
          set -euo pipefail
          mkdir -p runtime/ci
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file runtime/ci/requirements.txt
          diff -u <(tail -n +3 deploy/worker/requirements.txt) <(tail -n +3 runtime/ci/requirements.txt)
          worker_build_tag="groupagent-worker:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 --build-arg BASE_IMAGE=python@sha256:f3dac913ab53b78c64f26d5518fcd7043d5a1a46522d6a493b598c3ed12f62a6 -f deploy/worker/Dockerfile --iidfile runtime/ci/worker.iid --tag "$worker_build_tag" .
          test "$(docker image inspect --format '{{.Id}}' "$worker_build_tag")" = "$(cat runtime/ci/worker.iid)"
          test "$(docker image inspect --format '{{.Architecture}}' "$worker_build_tag")" = "amd64"
          docker build --build-arg WORKER_IMAGE="$worker_build_tag" -f deploy/worker/Dockerfile.harness --iidfile runtime/ci/harness.iid .
          test "$(docker image inspect --format '{{.Architecture}}' "$(cat runtime/ci/harness.iid)")" = "amd64"
          echo "GROUPAGENT_WORKER_IMAGE=$(cat runtime/ci/worker.iid)" >> "$GITHUB_ENV"
          echo "GROUPAGENT_HARNESS_IMAGE=$(cat runtime/ci/harness.iid)" >> "$GITHUB_ENV"
      - name: Verify genuine SDK, process isolation and artifact pipelines
        # Provider/model/channel fixtures remain synthetic; Docker/SDK/file bytes are real.
        run: uv run --no-sync pytest --strict-markers --strict-config tests/sandbox tests/execution/test_harness_real.py tests/artifacts/test_isolated_matrix.py tests/artifacts/test_chart_labels.py tests/media/test_sandbox_media.py tests/media/test_browser_worker.py tests/runtime/test_inputs.py -q --junitxml=runtime/ci/isolated-worker.xml
      - name: Require executed isolated-worker checks without skips
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases = ElementTree.parse(Path("runtime/ci/isolated-worker.xml")).findall(".//testcase")
          assert cases, "Isolated worker job executed no tests"
          assert not any(case.find("skipped") is not None for case in cases), "Required isolated-worker checks skipped"
          assert any("test_real_sdk_mcp_tool_loop" in case.attrib["name"] for case in cases), "Genuine SDK check missing"
          assert any("test_real_isolated_ten_case_matrix" in case.attrib["name"] for case in cases), "Isolated document matrix missing"
          PY
