# Dedicated native PostgreSQL 16+ instance. No shared/global cluster is changed.
data_directory = '/var/lib/pot-test2-postgres/data'
hba_file = '/etc/pot-test2/pg_hba.conf'
listen_addresses = ''
port = 55432
unix_socket_directories = '/run/pot-test2-postgres'
unix_socket_group = 'pot-test2'
unix_socket_permissions = 0770

max_connections = 16
superuser_reserved_connections = 3
shared_buffers = 32MB
wal_buffers = 1MB
work_mem = 2MB
temp_buffers = 2MB
maintenance_work_mem = 16MB
autovacuum_work_mem = 16MB
effective_cache_size = 128MB
huge_pages = off
jit = off
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
autovacuum_max_workers = 1
autovacuum_naptime = 60s
temp_file_limit = 128MB

# Keep durable work, WAL recovery and backups intact.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_wal_senders = 0
max_replication_slots = 0
min_wal_size = 32MB
max_wal_size = 128MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

logging_collector = off
log_destination = 'stderr'
log_statement = 'none'
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
