[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "groupagent"
version = "0.1.0.dev0"
description = "A group collaboration agent with durable work, scoped tools and verifiable delivery"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "pypdf>=6,<7",
  "reportlab>=4,<5",
  "Pillow>=11,<13",
]

[project.scripts]
groupagent = "groupagent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "hypothesis>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/groupagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: integration tests requiring an isolated PostgreSQL database", "render: document rendering with external tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

